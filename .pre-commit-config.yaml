repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: mise exec -- uv run --project backend ruff format backend
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: mise exec -- uv run --project backend ruff check --fix backend
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ty-check
        name: ty check
        entry: mise exec -- uv run --project backend ty check --project backend
        language: system
        files: ^backend/
        pass_filenames: false
      - id: biome-format
        name: biome format
        entry: mise exec -- pnpm --dir frontend exec biome format --write .
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: mise exec -- pnpm --dir frontend exec eslint
        language: system
        files: ^frontend/
        pass_filenames: false
