[project]
name = "backend"
version = "0.1.0"
description = "simple-chat-app backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# WebSocket の receive はタイムアウトを持たない。実装が壊れたとき、
# テストが止まらずに落ちるようにする
timeout = 10
