name: backend

on:
  push:
    paths:
      - "backend/**"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend.yml"

jobs:
  check:
    # 依存の解決はプラットフォームで変わる。sqlalchemy の greenlet は
    # platform_machine で条件が付いており、Apple Silicon だけ外れていた
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: uv sync --locked --project backend
      - run: pre-commit run ruff-format --all-files
      - run: pre-commit run ruff-check --all-files
      - run: pre-commit run ty-check --all-files
      - run: uv run --directory backend pytest
